<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galentines 2025</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fuzzy+Bubbles:wght@400;700"
      rel="stylesheet"
    />
    <script src="scripts.js" defer></script>
  </head>
  <body>
    <div class="bg-wrapper">
      <div class="bg-splash"></div>
    </div>
    <div class="bg-wrapper">
      <div id='bg-hearts' class="bg-hearts">
      </div>
    </div>
    <div class="bg-form">
      <div class="form">
        <p style="font-size: 1.4em;">hey Boo ❤,</p>
        <div style="display: grid;">
          <h3 style="margin: .2em 0;">name</h3>
          <input id="input-name" />
        </div>
        <p>Tell me what you're into.... for no particular reason.</p>
       
        <div style="position: relative; display: grid;">
          <h3>readables</h3>
          <image id="hugs-n-kisses" src="assets/hugs-and-kisses_transparent.png" />
        </div>

        <div class="readables">
          <input id="input-readable-1" type="text" />
          <input id="input-readable-2"  type="text" />
          <input id="input-readable-3"  type="text" />
        </div>
        <h3>munchables</h3>
        <input id="input-munchables" type="text" />

        <button type="submit" onclick="submitForm()" style="margin-top: 1em;">x o x o !</button>

      </div>
    </div>
  </body>
</html>
